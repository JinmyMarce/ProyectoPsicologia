<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug API de Feriados</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2d3748;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }
        .debug-section {
            background: #f7fafc;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            border-left: 5px solid #4299e1;
        }
        .debug-section h3 {
            color: #2b6cb0;
            margin-top: 0;
        }
        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: transform 0.2s;
        }
        .button:hover {
            transform: translateY(-2px);
        }
        .result {
            background: #edf2f7;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .error {
            background: #fed7d7;
            border-left: 5px solid #e53e3e;
        }
        .success {
            background: #c6f6d5;
            border-left: 5px solid #38a169;
        }
        .info {
            background: #bee3f8;
            border-left: 5px solid #3182ce;
        }
        .date-input {
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            margin: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Debug API de Feriados</h1>
        
        <div class="debug-section">
            <h3>📅 Configuración de Fechas</h3>
            <p><strong>Zona Horaria del Navegador:</strong> <span id="browser-timezone"></span></p>
            <p><strong>Fecha Actual del Navegador:</strong> <span id="browser-date"></span></p>
            <p><strong>Fecha Actual UTC:</strong> <span id="browser-utc"></span></p>
        </div>

        <div class="debug-section">
            <h3>🚀 Pruebas de API</h3>
            <div class="grid">
                <div>
                    <h4>1. Obtener Feriados del Mes</h4>
                    <input type="month" id="month-input" class="date-input" value="2025-01">
                    <button class="button" onclick="testGetHolidaysForMonth()">Obtener Feriados del Mes</button>
                    <div id="month-result" class="result"></div>
                </div>
                
                <div>
                    <h4>2. Obtener Feriados por Rango</h4>
                    <input type="date" id="start-date" class="date-input" value="2025-01-01">
                    <input type="date" id="end-date" class="date-input" value="2025-01-31">
                    <button class="button" onclick="testGetHolidaysInRange()">Obtener por Rango</button>
                    <div id="range-result" class="result"></div>
                </div>
                
                <div>
                    <h4>3. Verificar Fecha Específica</h4>
                    <input type="date" id="check-date" class="date-input" value="2025-01-01">
                    <button class="button" onclick="testCheckDate()">Verificar Fecha</button>
                    <div id="check-result" class="result"></div>
                </div>
            </div>
        </div>

        <div class="debug-section">
            <h3>🔧 Análisis de Fechas</h3>
            <button class="button" onclick="analyzeDates()">Analizar Fechas</button>
            <div id="analysis-result" class="result"></div>
        </div>

        <div class="debug-section">
            <h3>📊 Comparación de Datos</h3>
            <button class="button" onclick="compareData()">Comparar Datos</button>
            <div id="compare-result" class="result"></div>
        </div>
    </div>

    <script>
        // Mostrar información del navegador
        document.getElementById('browser-timezone').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone;
        document.getElementById('browser-date').textContent = new Date().toLocaleString('es-PE');
        document.getElementById('browser-utc').textContent = new Date().toISOString();

        // Función para formatear fechas
        function formatDate(date) {
            return date.toISOString().split('T')[0];
        }

        // Función para obtener feriados del mes
        async function testGetHolidaysForMonth() {
            const monthInput = document.getElementById('month-input').value;
            const [year, month] = monthInput.split('-');
            
            try {
                const response = await fetch(`http://localhost:8000/api/holidays/get-in-range`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        start_date: `${year}-${month}-01`,
                        end_date: `${year}-${month}-31`
                    })
                });

                const data = await response.json();
                
                let result = `📅 Feriados para ${month}/${year}:\n`;
                result += `✅ Status: ${response.status}\n`;
                result += `📊 Total: ${data.data?.length || 0}\n\n`;
                
                if (data.success && data.data) {
                    data.data.forEach(holiday => {
                        result += `🎉 ${holiday.name}\n`;
                        result += `   📅 Fecha: ${holiday.date}\n`;
                        result += `   🏛️ Tipo: ${holiday.type}\n`;
                        result += `   📝 Descripción: ${holiday.description || 'Sin descripción'}\n`;
                        result += `   🌍 Nacional: ${holiday.is_national ? 'Sí' : 'No'}\n`;
                        result += `   📍 Región: ${holiday.region || 'N/A'}\n\n`;
                    });
                } else {
                    result += `❌ Error: ${data.message || 'Error desconocido'}\n`;
                }
                
                document.getElementById('month-result').textContent = result;
                document.getElementById('month-result').className = 'result success';
                
            } catch (error) {
                document.getElementById('month-result').textContent = `❌ Error: ${error.message}`;
                document.getElementById('month-result').className = 'result error';
            }
        }

        // Función para obtener feriados por rango
        async function testGetHolidaysInRange() {
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            
            try {
                const response = await fetch(`http://localhost:8000/api/holidays/get-in-range`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        start_date: startDate,
                        end_date: endDate
                    })
                });

                const data = await response.json();
                
                let result = `📅 Feriados del ${startDate} al ${endDate}:\n`;
                result += `✅ Status: ${response.status}\n`;
                result += `📊 Total: ${data.data?.length || 0}\n\n`;
                
                if (data.success && data.data) {
                    data.data.forEach(holiday => {
                        result += `🎉 ${holiday.name}\n`;
                        result += `   📅 Fecha: ${holiday.date}\n`;
                        result += `   🏛️ Tipo: ${holiday.type}\n`;
                        result += `   📝 Descripción: ${holiday.description || 'Sin descripción'}\n\n`;
                    });
                } else {
                    result += `❌ Error: ${data.message || 'Error desconocido'}\n`;
                }
                
                document.getElementById('range-result').textContent = result;
                document.getElementById('range-result').className = 'result success';
                
            } catch (error) {
                document.getElementById('range-result').textContent = `❌ Error: ${error.message}`;
                document.getElementById('range-result').className = 'result error';
            }
        }

        // Función para verificar fecha específica
        async function testCheckDate() {
            const checkDate = document.getElementById('check-date').value;
            
            try {
                const response = await fetch(`http://localhost:8000/api/holidays/check-date`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        date: checkDate
                    })
                });

                const data = await response.json();
                
                let result = `📅 Verificando fecha: ${checkDate}\n`;
                result += `✅ Status: ${response.status}\n`;
                result += `📊 Es feriado: ${data.data?.is_holiday ? 'Sí' : 'No'}\n`;
                
                if (data.success && data.data?.holiday) {
                    const holiday = data.data.holiday;
                    result += `\n🎉 Feriado encontrado:\n`;
                    result += `   📅 Nombre: ${holiday.name}\n`;
                    result += `   🏛️ Tipo: ${holiday.type}\n`;
                    result += `   📝 Descripción: ${holiday.description || 'Sin descripción'}\n`;
                }
                
                document.getElementById('check-result').textContent = result;
                document.getElementById('check-result').className = 'result success';
                
            } catch (error) {
                document.getElementById('check-result').textContent = `❌ Error: ${error.message}`;
                document.getElementById('check-result').className = 'result error';
            }
        }

        // Función para analizar fechas
        function analyzeDates() {
            const now = new Date();
            const peruTime = new Date(now.toLocaleString("en-US", {timeZone: "America/Lima"}));
            
            let result = `🔍 Análisis de Fechas:\n\n`;
            result += `🌍 Navegador:\n`;
            result += `   📅 Fecha: ${now.toLocaleDateString('es-PE')}\n`;
            result += `   🕐 Hora: ${now.toLocaleTimeString('es-PE')}\n`;
            result += `   🌐 Zona: ${Intl.DateTimeFormat().resolvedOptions().timeZone}\n\n`;
            
            result += `🇵🇪 Perú (America/Lima):\n`;
            result += `   📅 Fecha: ${peruTime.toLocaleDateString('es-PE')}\n`;
            result += `   🕐 Hora: ${peruTime.toLocaleTimeString('es-PE')}\n`;
            result += `   🌐 Zona: America/Lima\n\n`;
            
            result += `📊 Comparación:\n`;
            result += `   ⏰ Diferencia: ${Math.abs(now.getTime() - peruTime.getTime()) / (1000 * 60 * 60)} horas\n`;
            result += `   📅 Mismo día: ${now.toDateString() === peruTime.toDateString() ? 'Sí' : 'No'}\n`;
            
            document.getElementById('analysis-result').textContent = result;
            document.getElementById('analysis-result').className = 'result info';
        }

        // Función para comparar datos
        function compareData() {
            let result = `📊 Comparación de Datos:\n\n`;
            
            // Simular datos de la API
            const apiDate = '2025-01-01';
            const browserDate = new Date('2025-01-01');
            const peruDate = new Date(browserDate.toLocaleString("en-US", {timeZone: "America/Lima"}));
            
            result += `🔗 API (Laravel):\n`;
            result += `   📅 Fecha: ${apiDate}\n`;
            result += `   📊 Tipo: String ISO\n\n`;
            
            result += `🌐 Navegador:\n`;
            result += `   📅 Fecha: ${browserDate.toISOString()}\n`;
            result += `   📊 Tipo: Date Object\n\n`;
            
            result += `🇵🇪 Perú (Calculado):\n`;
            result += `   📅 Fecha: ${peruDate.toISOString()}\n`;
            result += `   📊 Tipo: Date Object\n\n`;
            
            result += `🔍 Análisis:\n`;
            result += `   ✅ API vs Navegador: ${apiDate === browserDate.toISOString().split('T')[0] ? 'Iguales' : 'Diferentes'}\n`;
            result += `   ✅ API vs Perú: ${apiDate === peruDate.toISOString().split('T')[0] ? 'Iguales' : 'Diferentes'}\n`;
            
            document.getElementById('compare-result').textContent = result;
            document.getElementById('compare-result').className = 'result info';
        }
    </script>
</body>
</html>
